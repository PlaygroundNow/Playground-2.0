<style>
  ul {
    margin: 0;
    z-index: 1000;
    position: fixed;
    padding-left: 0;
    list-style: none;
    border-radius: 5px;
    padding-top: 5px;
    padding-bottom: 5px;
    background: white;
    border: 1px solid black;
  }

  li {
    width: 75px;
    cursor: pointer;
    list-style: none;
    padding: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  li:hover {
    background: #eee;
  }

  img {
    width: 18px;
    height: 18px;
  }
</style>

<template x-if="menuOpen">
  <ul
    :style="{ transform: `translate(${x}px, ${y}px )`}"
    @click.outside="menuOpen = false"
  >
    <li><img src="/assets/img/htmx.svg" /> Code</li>
  </ul>
</template>

<script type="module">
  export default {
    menuOpen: false,
    x: 0,
    y: 0,
    init() {
      this.$host.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        console.log(e);

        this.x = e.x;
        this.y = e.y;
        this.menuOpen = true;
      });
    },
  };
</script>
