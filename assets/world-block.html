<style>
  .world {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .world::before {
    z-index: -1;
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    text-align: center;
    background: white; /*#22333b*/
  }
  .space {
    touch-action: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 4096px;
    height: 4096px;
    background-size: 32px 32px;
    background-image: linear-gradient(
        to right,
        rgba(40, 126, 255, 0.1) 1px,
        transparent 1px
      ),
      linear-gradient(to bottom, rgba(40, 126, 255, 0.1) 1px, transparent 1px);
    transform: translate3d(0, 0, 0);
  }
</style>

<div
  class="world"
  @peer-mousemove.document="peerMouseMove"
  @mousemove.document="handleMouseMove"
>
  <div
    class="space"
    :style="{ transform: `translate(-${scrollX}px, -${scrollY}px)`}"
  >
    <slot></slot>
  </div>
</div>

<script type="module">
  function peerMouseMove(e) {
    let cursor = this.$host.querySelector(
      `cursor-block[peer="${e.detail.senderId}"]`
    );
    if (!cursor) {
      cursor = document.createElement("cursor-block");
      this.$host.appendChild(cursor);
      cursor.props.peer = e.detail.senderId;
    }
  }

  function handleMouseMove(e) {
    this.$broadcast("mousemove", {
      mouseX: e.clientX + this.scrollX,
      mouseY: e.clientY + this.scrollY,
    });
  }

  function handleScroll(e) {
    e.preventDefault();

    const newScrollX = this.scrollX + e.deltaX;
    const newScrollY = this.scrollY + e.deltaY;

    const maxScrollX = this.space.offsetWidth - this.world.offsetWidth;
    const maxScrollY = this.space.offsetHeight - this.world.offsetHeight;

    this.scrollX = Math.max(0, Math.min(newScrollX, maxScrollX));
    this.scrollY = Math.max(0, Math.min(newScrollY, maxScrollY));

    this.$props.scrollX = this.scrollX;
    this.$props.scrollY = this.scrollY;
  }

  export default {
    scrollX: 0,
    scrollY: 0,
    peerMouseMove,
    handleMouseMove,
    init() {
      this.world = this.$host.shadowRoot.querySelector(".world");
      this.space = this.$host.shadowRoot.querySelector(".space");

      document.addEventListener("wheel", handleScroll.bind(this), {
        passive: false,
      });
    },
  };
</script>
