<div x-effect="referrals = parse(doc.referrals)" class="wrapper">
  <div class="list">
    <div class="search">
      <input
        placeholder="Search referrals"
        x-model="props.search"
        x-effect="filter(props.search)"
      />
      <button @click="props.search=''" x-show="props.search">Clear</button>
    </div>
    <template x-for="referral in filtered">
      <div
        class="referral"
        :class="{ selected: props.selectedReferral === referral.id }"
        @click="props.selectedReferral = referral.id"
      >
        <div x-text="referral.name"></div>
      </div>
    </template>
    <div class="pagination">
      <template x-for="i in Math.ceil(referrals.length / limit)">
        <button
          @click="props.page = i-1"
          x-text="i"
          :class="{ selected: i-1 === Number(props.page) }"
        ></button>
      </template>
    </div>
  </div>
  <div x-show="props.selectedReferral" x-transition>
    <caregiver-form-block :id="props.selectedReferral"></caregiver-form-block>
  </div>
</div>

<script type="module">
  export default {
    mixins: [
      "@carehub/utils-mixin",
      "@carehub/styles-mixin",
      "@playground/block-mixin",
      "@playground/draggable-mixin",
    ],
    section: "caregiver",
    search: "",
    limit: 12,
    referrals: [],
    filtered: [],
    init() {
      if (!this.props.page) {
        this.props.page = 0;
      }

      if (!this.props.search) {
        this.props.search = "";
      }

      this.$watch("section", () => {
        if (this.section !== this.props.section) {
          this.props.section = this.section;
        }
      });
      this.$watch("props.section", () => {
        if (this.props.section !== this.section) {
          this.section = this.props.section;
        }
      });

      this.root = this.$el;
      this.referrals = this.parse(this.doc.referrals);
      this.filtered = this.referrals.slice(0, this.limit);
    },
    filter(search) {
      if (search) {
        this.props.page = 0;
      }

      this.filtered = this.referrals
        .filter((r) => r.name.toLowerCase().includes(search.toLowerCase()))
        .slice(
          Number(this.props.page) * this.limit,
          Number(this.props.page) * this.limit + this.limit
        );
    },
    parse(list) {
      return Object.entries(list).map(([id]) => this.getReferralById(id));
    },
  };
</script>
