<style>
  :host {
    position: absolute;
    top: 0;
    left: 0;
  }

  div {
    font-size: 16px;
  }

  button {
    background: none;
    border: 0;
    color: rgb(34 211 238);
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }

  input {
    width: 100%;
    padding: 8px;
    border: none;
  }
</style>

<window-block nav-title="Referrals" @close.stop="$host.remove()">
  <input placeholder="Search referrals" x-model="search" x-effect="filter(search)" />

  <template x-for="referral in filtered">
    <div
      :style="{ display: 'flex', justifyContent: 'space-between', padding: '8px' }"
    >
      <div x-text="referral.name"></div>
      <button @click="openReferral(referral.id)">Select</button>
    </div>
  </template>
</window-block>

<script type="module">
  import utils from "@carehub/utils-mixin";
  import styles from "@carehub/styles-mixin";
  import block from "@playground/block-mixin";
  import draggable from "@playground/draggable-mixin";

  export default {
    mixins: [utils, styles, block, draggable],
    search: '',
    limit: 10,
    page: 0,
    referrals: [],
    filtered: [],
    init() {
      this.root = this.$el;

      this.referrals = this.parse(this.doc.referrals);
      this.filtered = this.referrals.slice(0,this.limit);

      console.log(this.filtered)
    },
    filter(search) {
      this.filtered = this.referrals.filter((r) => {
        return r.name.toLowerCase().includes(search.toLowerCase());
      }).slice(this.page*this.limit, this.page*this.limit+this.limit)
    },
    parse(list) {
      return Object.entries(list).map(([id]) => this.getReferralById(id));
    },
    openReferral(id) {
      const libraryHtml = `<caregiver-form-block id="${id}" x="${
        this.x + this.root.offsetWidth + 20
      }" y="${this.y}"></caregiver-form-block>`;

      const world = document.querySelector("world-block");
      if (world) {
        world.insertAdjacentHTML("beforeend", libraryHtml);
      }
    },
  };
</script>
