<div @mouseover="halo = true" @mouseout="halo = false" drag-handle="">
  <div class="halo" x-show="halo">
    <button @click.stop="props.face = (props.face === 'up' ? 'down' : 'up')">
      <img src="/assets/img/undo.svg">
    </button>
    <button drag-handle="" @mousedown="props.stacking = true" @mouseup.window="props.stacking = false" :style="{
        background: props.stacking === 'true' ? 'var(--blue)' : 'white'
      }">
      <img src="/assets/img/carousel.svg">
    </button>
  </div>
  <img :src="
    props.face === 'up' ?
      `/assets/img/cards/${props.rank.slice(0,1).toUpperCase()}${props.suit.slice(0,1).toUpperCase()}.svg` :
      `/assets/img/cards/1B.svg`">
</div>

<script type="module">
  export default {
    mixins: [
      "@playground/block-mixin",
      "@playground/draggable-mixin"
    ],
    halo: false
  }
</script>
