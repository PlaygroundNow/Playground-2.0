<div class="piece" drag-handle @mousedown="activePieceIndex = (row-1)*8+col-1" @mouseup="mouseUp">
  <template x-if="value !== 0">
    <img :src="`/assets/img/chess/${color}_${piece}.png`" />
  </template>
</div>

<script type="module">
  import block from "@playground/block-mixin";
  import draggable from "@playground/draggable-mixin";
  
  export default {
    mixins: [block, draggable],
    value: 0,
    piece: '',
    color: 'white',
    key: {
      0: 'empty',
      1: 'pawn',
      2: 'knight',
      3: 'bishop',
      4: 'rook',
      5: 'queen',
      6: 'king'
    },
    init() {
      this.value = this.board[(this.row-1)*8 + this.col-1];
      this.piece = this.key[Math.abs(this.value)];
      this.color = this.value > 0 ? 'white' : 'black'
    },
    mouseUp() {
      console.log(this.hoveredSquareIndex, this.activePieceIndex)
      this.board[this.hoveredSquareIndex] = this.board[this.activePieceIndex];
      this.board[this.activePieceIndex] = 0;
    }
  }
</script>

<style>
  .piece {
    height: 53px;
    width: 53px;
    cursor: pointer;
    transition: scale 50ms;
  }

  .piece:hover img {
    scale: 0.9;
  }

  .piece:active img {
    scale: 1.1;
  }
  
  img {
    pointer-events: none;
    width: 53px;
    height: 53px;
  }
</style>
