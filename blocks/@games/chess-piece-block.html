<div class="piece" drag-handle @mouseup="mouseup">
    <img :src="`/assets/img/chess/${color}_${piece}.png`" />
</div>

<script type="module">
  import block from "@playground/block-mixin";
  import draggable from "@playground/draggable-mixin";
  
  export default {
    mixins: [block, draggable],
    value: 0,
    piece: '',
    color: 'white',
    key: {
      0: 'empty',
      1: 'pawn',
      2: 'knight',
      3: 'bishop',
      4: 'rook',
      5: 'queen',
      6: 'king'
    },
    init() {
      this.value = Number(this.board[this.index-1]);
      this.piece = this.key[Math.abs(this.value)];
      this.color = this.value < 0 ? "black" : "white";

      if (this.props.x && this.props.y) return;
      
      const row = Math.floor((this.index-1) / 8); // 0–7
      const col = (this.index-1) % 8;

      this.props.x = col*55;
      this.props.y = row*55;
    },
    mouseup() {
      const idx = this.hoveredSquareIndex;
      if (idx > -1) {
        const row = Math.floor(idx / 8); // 0–7
        const col = idx % 8;
  
        this.props.x = col*55;
        this.props.y = row*55;
      }
    }
  }
</script>

<style>
  :host {
    position: absolute;
    top: 0;
    left: 0;
  }
  
  .piece {
    height: 53px;
    width: 53px;
    cursor: pointer;
    transition: scale 50ms;
  }

  .pieces:active {
    z-index: 1;
  }

  .piece:hover img {
    scale: 0.9;
  }

  .piece:active img {
    scale: 1.1;
    z-index: 10000;
  }
  
  img {
    position: relative;
    pointer-events: none;
    width: 53px;
    height: 53px;
  }
</style>
