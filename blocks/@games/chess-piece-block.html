<div class="piece" drag-handle @mouseup="mouseup">
  <img :src="`/assets/img/chess/${props.color}_${props.piece}.png`" />
</div>

<script type="module">
  import block from "@playground/block-mixin";
  import draggable from "@playground/draggable-mixin";

  export default {
    mixins: [block, draggable],
    key: {
      0: "empty",
      1: "pawn",
      2: "knight",
      3: "bishop",
      4: "rook",
      5: "queen",
      6: "king",
    },
    init() {
      this.value =
        this.props.color === "white"
          ? this.key[this.props.piece]
          : -this.key[this.props.piece];

      if (this.props.x && this.props.y) return;

      const col = this.props.square.charCodeAt(0) - 97;
      const row = 8 - parseInt(this.props.square[1]);

      this.props.x = col * 55;
      this.props.y = row * 55;
    },
    mouseup() {
      const idx = this.hoveredSquareIndex;

      if (idx > -1) {
        const row = Math.floor(index / 8);
        const col = index % 8;

        const file = String.fromCharCode(97 + col);
        const rank = 8 - row;

        this.props.square = file + rank;
      }
    },
  };
</script>

  }
</style>
