<div class="piece" drag-handle="" @mouseup="mouseup">
  <img :src="`/assets/img/chess/${props.color}_${props.piece}.png`">
</div>

<script type="module">
  export default {
    mixins: ["@playground/block-mixin", "@playground/draggable-mixin"],
    key: {
      0: "empty",
      1: "pawn",
      2: "knight",
      3: "bishop",
      4: "rook",
      5: "queen",
      6: "king",
    },
    init() {
      this.value =
        this.props.color === "white"
          ? this.key[this.props.piece]
          : -this.key[this.props.piece];

      if (this.props.x && this.props.y) return;

      const col = this.props.square.charCodeAt(0) - 97;
      const row = 8 - parseInt(this.props.square[1]);

      this.props.x = col * 60;
      this.props.y = row * 60;
    },
    mouseup() {
      const idx = this.hoveredSquareIndex;

      if (idx > -1) {
        const row = Math.floor(idx / 8);
        const col = idx % 8;

        const file = String.fromCharCode(97 + col);
        const rank = 8 - row;

        this.props.square = file + rank;

        const parent = this.$host.parentElement;
        if (parent) {
          const targetSquare = file + rank;
          for (const el of parent.querySelectorAll("chess-piece-block")) {
            if (el === this.$host) continue;
            if (el.props?.square === targetSquare) {
              el.props.square = '';
              el.props.x = 60 * 8; // capture: move off-board
              break;
            }
          }
        }

        this.props.x = col * 60;
        this.props.y = row * 60;
      }
    },
  };
</script>

<style>
  :host {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .piece {
    height: 60px;
    width: 60px;
    cursor: pointer;
    transition: scale 50ms;

    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }

  .pieces:active {
    z-index: 1;
  }

  .piece:hover img {
    scale: 0.9;
  }

  img {
    position: relative;
    pointer-events: none;
    width: 53px;
    height: 53px;
  }
</style>
