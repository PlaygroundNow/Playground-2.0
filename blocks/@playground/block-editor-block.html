<div @save="save" x-effect="getFile(props.file)">
  <template x-if="html">
    <code-block :file="props.file" :source="html"></code-block>
  </template>
</div>

<script type="module">
  import { decode } from "https://esm.sh/html-entities";

  export default {
    mixins: ["@playground/block-mixin"],
    html: "",

    async getFile(file) {
      // const html = await fetch("/blocks/" + this.props.file + ".html").then(
      //   (res) => res.text()
      // );

      const [pkg, tag] = file.split("/");
      const html = document.querySelector(`#${pkg.slice(1)}-${tag}`).innerHTML;

      this.html = decode(html);
    },
    async save(event) {
      const { source } = event.detail; // e.g. "source-playground-my-widget-block"
      const [, pkg, ...rest] = source.split("-"); // pkg="playground", rest=["my","widget","block"]
      const tag = rest.join("-"); // "my-widget-block"
      const file = `/blocks/@${pkg}/${tag}.html`;

      const html = handle.doc()[source];
      if (!html) throw new Error("Cannot save text, missing from handle");

      await fetch(file, {
        method: "PUT",
        headers: { accept: "application/json" },
        body: html,
      });

      document.querySelector(`#${pkg}-${tag}`).innerHTML = html;

      this.$broadcast("updated-file", { file, name: `${pkg}-${tag}`, tag });
      if (!source.endsWith("block")) return;

      const wc = customElements.get(tag);
      if (wc) wc.reloadAllBlocks();
    },
  };
</script>
