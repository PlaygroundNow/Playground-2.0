<style>
</style>

<div @save="save" x-effect="getFile(props.file)">
  <template x-if="html">
    <code-block
      :file="props.file"
      :source="html"
      :scroll-top="scrollTop"
    ></code-block>
  </template>
</div>

<script type="module">
  import block from "@playground/block-mixin";

  export default {
    html: "",
    mixins: [block],
    scrollTop: 0,
    async getFile(file) {
      const html = await fetch("/blocks/@playground/" + file + ".html").then(
        (res) => res.text()
      );

      this.html = html;
      this.scrollTop = 0;
    },
    async save(event) {
      const source = event.detail.source;
      const [_, ...name] = source.split("-");

      const file = "/blocks/@playground/" + name.join("-") + ".html";
      const html = handle.doc()[source];

      if (!html) {
        throw new Error("Cannot save text, missing from handle");
      }

      await fetch(file, {
        method: "PUT",
        headers: {
          accept: "application/json",
        },
        body: html,
      });

      this.$broadcast("updated-file", {
        file,
        name: name.join("-"),
      });

      if (source.endsWith('mixin')) return;

      const wc = customElements.get(name.join("-"));

      wc.template = html;
      this.html = html;
    },
  };
</script>
