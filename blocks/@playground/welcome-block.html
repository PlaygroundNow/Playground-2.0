<div
  @mouseup.window="props.first = false; props.second = false;"
  @touchend.window="props.first = false; props.second = false;"
  x-effect="if (!props.done === 'true') { props.open = props.first === 'true' && props.second === 'true' }"
>
  <div class="glass"></div>
  <div class="stage">
    <div class="wrapper" x-show="props.done !== 'true'" x-transition.500ms>
      <div>
        Speak
        <span :style="{ color: props.first === 'true' && '#f15158'}">fri</span
        ><span :style="{ color: props.second === 'true' && '#7289da'}"
          >end</span
        >
        <br />and enter.
      </div>

      <div class="buttons">
        <button
          @mousedown="props.first = true"
          @touchstart="props.first = true"
          :class="{ selected: props.first === 'true' }"
        >
          Fri
        </button>
        <button
          @mousedown="props.second = true"
          @touchstart="props.second = true"
          :class="{ selected: props.second === 'true' }"
        >
          end
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import block from "@playground/block-mixin";
  import menu from "@playground/menu-mixin";

  export default {
    mixins: [block],
    init() {
      localStorage.setItem("door", false);

      this.$watch("props.open", () => {
        if (this.props.open === "true") {
          this.props.done = true;
          localStorage.setItem("door", true);
          this.$world.door = true;
          this.$host.remove();
        }
      });
    },
  };
</script>
