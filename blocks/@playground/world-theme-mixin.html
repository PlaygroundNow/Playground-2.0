<script type="module">
  export default {
    mixins: [],
    init() {
      this.$nextTick(this.loadParticles.bind(this));
      this.$watch("doc.theme", this.loadParticles.bind(this));
    },
    loadParticles() {
      if (this.doc.theme === 'turf') {
        particlesJS.clear.call(
          this.$el,
          "space"
        );
        return;
      }
      
      particlesJS.load.call(
        this.$el,
        "space",
        `assets/scripts/particle-presets/${this.doc.theme || "bubble"}.json`
      );
    },
  };
</script>

<template x-if="doc.theme === 'bubble'">
  <style>
    .space {
      background-color: #2c2e43;
      box-shadow: 0 0 80px 20px #2c2e43, 0 0 200px 60px #2c2e43;
    }
  </style>
</template>

<template x-if="doc.theme === 'snow'">
  <style>
    .space {
      background-color: var(--red);
      box-shadow: 0 0 80px 20px var(--red), 0 0 200px 60px var(--red);
    }
  </style>
</template>

<template x-if="doc.theme === 'night'">
  <style>
    .space {
      background-color: #232741;
      box-shadow: 0 0 80px 20px #232741, 0 0 200px 60px #232741;
    }
  </style>
</template>

<template x-if="doc.theme === 'turf'">
  <style>
    .space {
      background-image: url("/assets/img/turf.jpg");
      background-repeat: repeat;
      background-size: 1060px 398px; /* adjust for tile size */
      background-position: 0 0;
      box-shadow: 0 0 80px 20px #232741, 0 0 200px 60px #232741;
    }
  </style>
</template>
