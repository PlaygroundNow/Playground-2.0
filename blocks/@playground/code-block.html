<style>
  .wrapper {
    width: 800px;
    height: 600px;
    background: rgb(40, 44, 52);
  }
</style>

<div class="wrapper"></div>

<script type="module">
  import { basicSetup } from "https://esm.sh/codemirror";
  import {
    EditorView,
    ViewPlugin,
    keymap,
  } from "https://esm.sh/@codemirror/view";
  import { ChangeSet, Annotation } from "https://esm.sh/@codemirror/state";
  import { html } from "https://esm.sh/@codemirror/lang-html";
  import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark";
  import { vscodeKeymap } from "https://esm.sh/@replit/codemirror-vscode-keymap";

  const playgroundTheme = EditorView.theme({
    "&": {
      fontSize: "13px",
    },
    ".cm-editor": {
      height: "100%",
    },
    ".cm-scroller": {
      height: "600px",
      overflow: "auto",
    },
  });

  export default {
    init() {
      this.loadEditor();

      this.$watch("props.source", () => {
        this.loadEditor();
      });
    },
    save(view) {
      this.$dispatch("save", { source: "source-" + this.props.file });
      return true;
    },
    loadEditor(source) {
      setTimeout(() => {
        console.log(this.props.scrollTop, " from loadEditor");

        const name = "source-" + this.props.file;
        this.$el.replaceChildren();
        this.doc[name] = this.props.source;

        const saveKeymap = keymap.of([
          {
            key: "Meta-s",
            run: this.save.bind(this),
          },
        ]);

        const view = new EditorView({
          doc: handle.doc()[name],
          parent: this.$el,
          extensions: [
            basicSetup,
            window.automergeSyncPlugin({
              handle,
              path: [name],
              automerge: window.Automerge,
              codemirror: {
                state: {
                  Annotation,
                  ChangeSet,
                },
                view: {
                  ViewPlugin,
                },
              },
            }),
            saveKeymap,
            playgroundTheme,
            oneDark,
            keymap.of(vscodeKeymap),
            html(),
          ],
        });

        this.$nextTick(() => {
          const scroller = this.$el.querySelector(".cm-scroller");

          if (this.props.scrollTop) {
            scroller.scrollTo({
              top: this.props.scrollTop,
              behavior: "smooth",
            });
          }

          scroller.addEventListener("scroll", (e) => {
            this.props.scrollTop = e.target.scrollTop;
          });
        });
      }, 1000);
    },
  };
</script>
