<style>
  :host {
    z-index: 10000;
    position: absolute;
  }

  .wrapper {
    position: fixed;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    border-radius: 8px;
    background: white;
  }

  @media (max-width: 600px) {
    .wrapper {
      width: 400px;
    }
  }

  input {
    width: 100%;
    padding: 16px 64px;
    background: none;
    border: none;
    font-size: 24px;
  }

  .search {
    position: relative;
  }

  .search > img {
    display: block;
    z-index: 1;
    pointer-events: none;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
  }

  .results {
    border-top: 1px solid #36454f;
  }

  .item {
    padding: 8px;
    font-size: 24px;
  }
  
</style>

<div @click.stop @click.outside="spotlightOpen = false" class="wrapper">
  <div class="search">
    <img src="/assets/img/search.svg" /><input autofocus x-model="search" />
  </div>
  <div class="results">
    <template x-for="item in items">
      <div class="item" x-text="item.name"></div>
    </template>
  </div>
</div>

<script type="module">
  import blockMixin from "@playground/block-mixin";

  export default {
    search: "",
    items: [],
    mixins: [blockMixin],
    async init() {
      this.$el.querySelector("input").focus();

      this.items = await fetch('/blocks/@playground', {
        headers: {'accept': 'application/json'}
      }).then(resp => resp.json());
    },
  };
</script>
