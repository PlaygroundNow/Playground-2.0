<script type="module">
  export default {
    dragging: false,
    x: 0,
    y: 0,
    init() {
      // start at prop values, render locally
      this.x = Number(this.props.x) || 0;
      this.y = Number(this.props.y) || 0;
      this.render();

      this.$el.addEventListener("mousedown", this.mousedown.bind(this));
      document.addEventListener("mousemove", this.mousemove.bind(this));
      document.addEventListener("mouseup", this.mouseup.bind(this));
    },
    mousedown(e) {
      if (e.target.shadowRoot) {
        const els = e.target.shadowRoot.elementsFromPoint(e.clientX, e.clientY);
        if (!els[0]?.hasAttribute("drag-handle")) return;
      } else if (!e.target.hasAttribute("drag-handle")) return;

      e.stopPropagation();

      this.dragging = true;
      this.startX = this.x;
      this.startY = this.y;
      this.startClientX = e.clientX;
      this.startClientY = e.clientY;

      this.$el.style.willChange = "transform";
      
      e.preventDefault();
    },
    mousemove(e) {
      if (!this.dragging) return;
      this.x = this.startX + (e.clientX - this.startClientX);
      this.y = this.startY + (e.clientY - this.startClientY);
      this.render();
    },
    mouseup() {
      if (!this.dragging) return;
      this.dragging = false;
      this.$el.style.willChange = "";

      if (this.props.x !== this.x) this.props.x = this.x;
      if (this.props.y !== this.y) this.props.y = this.y;
    },
    render() {
      this.$el.style.transform = `translate(${this.x}px, ${this.y}px)`;
    },
  };
</script>
