<script type="module">
  export default {
    dragging: false,
    x: 0,
    y: 0,
    init() {
      this.x = Number(this.props.x) || 0;
      this.y = Number(this.props.y) || 0;
      this.draggableRender();

      this.$watch("props.x", () => {
        this.x = Number(this.props.x) || 0;
        this.y = Number(this.props.y) || 0;
        this.draggableRender();
      });
      this.$watch("props.y", () => {
        this.x = Number(this.props.x) || 0;
        this.y = Number(this.props.y) || 0;
        this.draggableRender();
      });

      this._onPeerDragging = (e) => {
        const { x, y } = e.detail || {};
        this.draggableRender(x, y);
      };

      document.addEventListener(
        `peer-dragging-${this.$host.id}`,
        this._onPeerDragging.bind(this)
      );

      this.$el.addEventListener(
        "mousedown",
        this.draggableMouseDown.bind(this)
      );
      document.addEventListener(
        "mousemove",
        this.draggableMouseMove.bind(this)
      );
      document.addEventListener("mouseup", this.draggableMouseUp.bind(this));
    },
    destroy() {
      document.removeEventListener(
        `peer-dragging-${this.$host.id}`,
        this._onPeerDragging
      );
    },
    draggableMouseDown(e) {
      if (e.target.shadowRoot) {
        const els = e.target.shadowRoot?.elementsFromPoint(
          e.clientX,
          e.clientY
        );
        if (
          !els?.some((el) => el?.hasAttribute("drag-handle")) &&
          !e.target.hasAttribute("drag-handle")
        )
          return;
      } else if (e.target.getRootNode() instanceof ShadowRoot) {
        const els = e.target
          .getRootNode()
          ?.elementsFromPoint(e.clientX, e.clientY);
        if (!els?.some((el) => el?.hasAttribute("drag-handle"))) return;
      }

      e.stopPropagation();
      this.dragging = true;
      this.startX = this.x;
      this.startY = this.y;
      this.startClientX = e.clientX;
      this.startClientY = e.clientY;
      this.$el.style.willChange = "transform";
      e.preventDefault();
    },
    draggableMouseMove(e) {
      if (!this.dragging) return;

      this.x = this.startX + (e.clientX - this.startClientX);
      this.y = this.startY + (e.clientY - this.startClientY);
      this.draggableRender();

      // send to peers only listening for this id
      this.$broadcast(`dragging-${this.$host.id}`, { x: this.x, y: this.y });
    },
    draggableMouseUp() {
      if (!this.dragging) return;
      this.dragging = false;
      this.$el.style.willChange = "";

      if (this.props.x !== this.x) this.props.x = this.x;
      if (this.props.y !== this.y) this.props.y = this.y;
    },
    draggableRender(x, y) {
      this.$el.style.transform = `translate(${x || this.x}px, ${
        y || this.y
      }px)`;
    },
  };
</script>
