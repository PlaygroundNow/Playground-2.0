<div drag-handle>
  <button class="red" @click.stop="$host.remove()"></button>
  <button class="blue" @click.stop="nextState"></button>
  <img :src="`/assets/img/fido/fido_${props.state}.gif`" />
</div>

<script type="module">
  export default {
    states: [
      "sleeping",
      "begging",
      "sprinting",
      "running",
      "laying",
      "sitting",
      "wagging",
    ],
    mixins: ["@playground/block-mixin", "@playground/draggable-mixin"],
    init() {
      this.props.state = "begging";
    },
    nextState(e) {
      let next = this.states.indexOf(this.props.state) + 1;

      if (next > this.states.length - 1) {
        next = 0;
      }

      this.props.state = this.states[next];
    },
  };
</script>

    position: absolute;
    cursor: pointer;
    border: 1px solid var(--grey);
