<div class="wrapper" :style="{ flexDirection: 'column' }">
  <div class="card">
    <flex-block :style="{ flexDirection: 'column', alignItems: 'center' }">
      <img class="logo" src="/assets/img/favicon.svg" />
      <h1>Playground</h1>
    </flex-block>
    <flex-block :style="{ width: '100%' }">
      <input x-show="state !== 'recover'" x-model="email" placeholder="Email" />
    </flex-block>
    <flex-block :style="{ width: '100%' }">
      <input
        x-show="state !== 'reset'"
        x-model="password"
        type="password"
        placeholder="Password"
      />
    </flex-block>
    <template x-if="state === 'recover'">
      <flex-block :style="{ width: '100%' }">
        <input
          x-model="confirmPassword"
          type="password"
          placeholder="Password"
        />
      </flex-block>
    </template>
    <flex-block :style="{ width: '100%', flexDirection: 'column' }">
      <button
        @click="state === 'recover' ? updatePassword() : state === 'reset' ? reset() : state === 'create' ? signUp() : signIn()"
        x-text="state === 'recover' ? 'Update Password' : state === 'reset' ? 'Reset Password' : state === 'create' ? 'Get Started' : 'Login'"
      ></button>
      <div class="messages">
        <div class="error" x-text="errorMessage"></div>
        <div class="success" x-text="successMessage"></div>
      </div>
      <div :style="{ marginTop: '8px'}">
        <template x-if="state !== 'create'">
          <div :style="{ textAlign: 'center' }">
            Don't have an account?
            <br />
            <span @click="state = 'create'">Get started</span>
            or
            <span @click="state = 'reset'">Reset your password</span>
          </div>
        </template>
        <template x-if="state === 'create'">
          <div>
            Have an account already?
            <span @click="state = 'login'">Login</span>
          </div>
        </template>
      </div>
    </flex-block>
  </div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js";

  const supabase = createClient(
    "https://ifteoortevgzwvlbkjev.supabase.co",
    "sb_publishable_HVSLUqC4MdXCJzTbbJR24w_ylDOODOF"
  );

  export default {
    mixins: [],
    state: "login", // login | reset | create | recover
    params: null,
    errorMessage: "",
    successMessage: "",
    email: "",
    password: "",
    confirmPassword: "",
    init() {
      if (location.hash.includes("access_token")) {
        this.params = new URLSearchParams(location.hash.slice(1));

        if (this.params.get("type") === "recovery") {
          this.state = "recover";

          console.log(this.params);
        }
      }
    },
    async reset() {
      this.errorMessage = "";
      this.successMessage = "";

      const { data, error } = await supabase.auth.resetPasswordForEmail(
        this.email,
        {
          redirectTo: location.origin,
        }
      );

      if (error) {
        this.errorMessage = error.message;
      } else {
        this.successMessage = "Check your email";
      }
    },
    async signIn() {
      this.errorMessage = "";
      this.successMessage = "";

      const { data, error } = await supabase.auth.signInWithPassword({
        email: this.email,
        password: this.password,
      });

      if (error) {
        this.errorMessage = error.message;
      }

      console.log(data, error);
    },
    async signUp() {
      this.errorMessage = "";
      this.successMessage = "";

      const { data, error } = await supabase.auth.signUp({
        email: this.email,
        password: this.password,
        options: {
          emailRedirectTo: location.origin,
        },
      });

      if (error) {
        this.errorMessage = error.message;
      } else {
        this.successMessage = "Success! Check your email";
      }

      console.log(data, error);
    },
  };
</script>
