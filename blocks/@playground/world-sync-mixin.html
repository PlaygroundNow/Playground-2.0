<script type="module">
  export default {
    lastChange: JSON.stringify(handle.doc()),
    init() {
      syncDocToWorld(handle.doc(), this.$host);
      startObserver.call(this);

      this.$watch("doc.world", (newVal, oldVal) => {
        if (this.lastChange === JSON.stringify(handle.doc())) return;

        stopObserver.call(this);
        syncDocToWorld(handle.doc(), this.$host);
        startObserver.call(this);
      });
    },
  };

  function stopObserver() {
    if (this._mutationObserver) {
      this._mutationObserver.disconnect();
      this._mutationObserver = null;
    }
  }

  function startObserver() {
    const ensureId = (el) =>
      el.tagName !== "WORLD-BLOCK" &&
      (el.id ||= "pg" + crypto.randomUUID().replace(/-/g, ""));
    const isTracked = (el) =>
      el instanceof Element && el.constructor?.name === "AlpineBlockSFC";
    const isBlockCtor = (el) =>
      el instanceof Element && el.constructor?.name === "AlpineBlockSFC";
    const findIdx = (id, doc) => doc.world.findIndex((n) => n.id === id);
    const ensureEntry = (el, doc) => {
      const id = ensureId(el);
      let i = findIdx(id, doc);
      if (i === -1) {
        doc.world.push({ id, tagName: el.tagName.toLowerCase(), props: {} });
        i = doc.world.length - 1;
      }
      return i;
    };
    const syncProps = (entry, el) => {
      const seen = new Set();
      for (const a of el.attributes) {
        if (a.name === "id" || a.name.startsWith(":") || a.name.startsWith("@"))
          continue;
        if (entry.props[a.name] !== a.value) entry.props[a.name] = a.value;
        seen.add(a.name);
      }
      for (const k of Object.keys(entry.props))
        if (!seen.has(k)) delete entry.props[k];
    };
    const removeCascade = (rootId, doc) => {
      const toDelete = new Set([rootId]);
      let changed = true;
      while (changed) {
        changed = false;
        for (const n of doc.world) {
          if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) {
            toDelete.add(n.id);
            changed = true;
          }
        }
      }
      for (let k = doc.world.length - 1; k >= 0; k--)
        if (toDelete.has(doc.world[k].id)) doc.world.splice(k, 1);
    };
    const getParentId = (el) =>
      el.tagName === "WORLD-BLOCK"
        ? null
        : el.parentElement && isTracked(el.parentElement)
        ? ensureId(el.parentElement)
        : null;

    const applyOps = (doc, ops) => {
      for (const op of ops) op(doc);
    };

    const buildOps = (mutations) => {
      const ops = [];
      for (const m of mutations) {
        if (m.type === "childList") {
          const parentId = isTracked(m.target) ? m.target.id || null : null;

          // ADDED
          for (const n of [...m.addedNodes].filter(isTracked)) {
            ops.push((doc) => {
              const i = ensureEntry(n, doc);
              const entry = doc.world[i];
              entry.tagName = n.tagName.toLowerCase();
              syncProps(entry, n);
              if (parentId) entry.parentId = parentId;
              else delete entry.parentId;
            });
          }

          // REMOVED
          for (const n of m.removedNodes) {
            if (!(n instanceof Element) || !isBlockCtor(n)) continue;
            const id = n.id;
            ops.push((doc) => {
              const idx = id ? findIdx(id, doc) : -1;
              if (idx !== -1) {
                removeCascade(id, doc);
              } else {
                const ids = [...n.querySelectorAll("*")]
                  .map((e) => e.id)
                  .filter(Boolean);
                for (const childId of ids) {
                  const ci = findIdx(childId, doc);
                  if (ci !== -1) removeCascade(childId, doc);
                }
              }
            });
          }
        } else if (m.type === "attributes" && isTracked(m.target)) {
          const el = m.target;
          ops.push((doc) => {
            const i = ensureEntry(el, doc);
            const entry = doc.world[i];
            entry.tagName = el.tagName.toLowerCase();
            syncProps(entry, el);
            const pid = getParentId(el);
            if (pid) entry.parentId = pid;
            else delete entry.parentId;
          });
        }
      }
      return ops;
    };

    this.lastChange = JSON.stringify(handle.doc());

    this._mutationObserver = new MutationObserver((mutations) => {
      const ops = buildOps(mutations);
      if (ops.length === 0) return;

      // Preflight: simulate on a clone
      const draft = structuredClone(handle.doc());
      applyOps(draft, ops);
      const next = JSON.stringify(draft);
      if (next === this.lastChange) return;

      // Commit: apply the same ops inside handle.change
      handle.change((doc) => applyOps(doc, ops));
      this.lastChange = next;
    });

    this._mutationObserver.observe(this.$host, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeOldValue: true,
    });
  }

  function syncDocToWorld(doc, host = document.querySelector("world-block")) {
    const root = document.querySelector("world-block") || host;

    const isBlock = (el) =>
      el instanceof Element && el.constructor?.name === "AlpineBlockSFC";

    const desired = new Map(doc.world.map((n) => [n.id, n]));
    const byId = Object.fromEntries(doc.world.map((n) => [n.id, n]));

    // Remove extras anywhere under host
    for (const el of root.querySelectorAll("*")) {
      if (!isBlock(el)) continue;
      if (!desired.has(el.id)) el.remove();
    }

    const ensureEl = (node) => {
      if (!node) return null;

      // ensure parent container
      const parent =
        (node.parentId && byId[node.parentId]
          ? ensureEl(byId[node.parentId])
          : root) || root;

      // create/replace
      let el = document.getElementById(node.id);
      if (!el) {
        el = document.createElement(node.tagName);
        el.id = node.id;
        parent.appendChild(el);
      } else if (el.tagName.toLowerCase() !== node.tagName) {
        const repl = document.createElement(node.tagName);
        repl.id = node.id;
        el.replaceWith(repl);
        el = repl;
      }

      // ensure correct parent
      if (el.parentElement !== parent) parent.appendChild(el);

      // sync attributes (props is an object; ignore id, :*, @*)
      const props = node.props || {};
      const desiredNames = new Set(Object.keys(props));
      for (const { name } of [...el.attributes]) {
        if (name === "id" || name.startsWith(":") || name.startsWith("@"))
          continue;
        if (!desiredNames.has(name)) el.removeAttribute(name);
      }
      for (const name of desiredNames) {
        if (name.startsWith(":") || name.startsWith("@")) continue;
        const str = props[name] == null ? "" : String(props[name]);
        if (el.getAttribute(name) !== str) el.setAttribute(name, str);
      }

      return el;
    };

    // Create / update all (parents auto-created first via recursion)
    for (const node of doc.world) ensureEl(node);
  }
</script>
