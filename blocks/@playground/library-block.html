<style>
  :host {
    position: absolute;
    top: 0;
    left: 0;
  }

  .wrapper {
    max-height: 600px;
    font-size: 20px;

    display: flex;
    align-items: stretch;
  }

  .section {
    min-width: 120px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .section:not(:last-child) {
    border-right: 1px solid lightblue;
  }

  .selected {
    background: lightblue;
  }

  .package {
    padding: 6px 12px;
    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 12px;
    text-transform: capitalize;
  }

  .package img {
    width: 16px;
    height: 16px;
    margin-top: 6px;
  }

  .package:hover {
    background: #eee;
    color: black;
  }

  .file-menu {
    display: flex;
    flex-direction: column;
    padding: 6px 12px;
    border-bottom: 1px solid lightblue;
  }

  .file-menu input {
    font-size: 18px;
    padding: 0 8px;
  }

  .actions {
    display: flex;
    gap: 8px;
    padding-bottom: 8px;
  }

  .actions button {
    position: relative;
    background: white;
    border: 1px solid lightblue;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    cursor: pointer;
  }

  .actions img {
    height: 16px;
    width: 16px;
  }

  .actions img.plus {
    position: absolute;
    top: -5px;
    left: -5px;

    height: 16px;
    width: 16px;
    background: white;
    border-radius: 50%;
    border: 1px solid lightblue;
    padding: 2px;
  }

  .edit-name {
    font-size: 18px;
  }
</style>

<window-block
  :nav-title="'Library' + (props.selectedFile ? ' - ' + props.selectedFile : '')"
  @close.stop="$host.remove()"
  x-effect="getPackageFiles"
>
  <div class="wrapper">
    <div class="section">
      <template x-for="package in packages">
        <div
          class="package"
          :class="{ selected: props.selectedPackage === package.name }"
          x-text="package.name"
          @click="props.selectedPackage = package.name"
        ></div>
      </template>
    </div>
    <div class="section">
      <div class="file-menu">
        <div class="actions">
          <button @click="createBlock" title="Create Block">
            <img class="plus" src="/assets/img/math-plus.svg" />
            <img src="/assets/img/extension.svg" />
          </button>
          <button @click="createMixin" title="Create Mixin">
            <img class="plus" src="/assets/img/math-plus.svg" />
            <img src="/assets/img/plug.svg" />
          </button>
        </div>
        <input
          placeholder="Filter..."
          x-model="props.search"
          x-effect="filter(props.search)"
        />
      </div>
      <div :style="{ overflowY: 'scroll' }">
        <template x-for="file in filtered">
          <div
            class="package"
            :data-selected="props.selectedFile === file.name + '-' + file.type"
            :class="{ selected: props.selectedFile === file.name + '-' + file.type }"
            @click="if (!files.some(f => f.newName !== undefined)) {
              props.selectedFile = file.name + '-' + file.type
            }"
          >
            <img
              :style="{ alignSelf: 'flex-start' }"
              :src="file.type === 'block' ? '/assets/img/extension.svg' : '/assets/img/plug.svg'"
            />
            <template x-if="file.newName === undefined">
              <span x-text="file.name"></span>
            </template>
            <template x-if="file.newName !== undefined">
              <div :style="{ display: 'flex', flexDirection: 'column' }">
                <input
                  class="edit-name"
                  autofocus
                  x-model="file.newName"
                  x-effect="validateName(file)"
                  @blur.stop.prevent="validateName(file, true)"
                />
                <div
                  :style="{ color: 'darkred', fontSize: '16px', textTransform: 'none' }"
                  x-show="file.error"
                  x-html="file.error"
                ></div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
    <div class="section" x-show="props.selectedFile">
      <template x-if="props.selectedFile">
        <block-editor-block :file="props.selectedFile"></block-editor-block>
      </template>
    </div>
  </div>
</window-block>

<script type="module">
  import block from "@playground/block-mixin";
  import files from "@playground/files-mixin";
  import draggable from "@playground/draggable-mixin";

  export default {
    mixins: [block, draggable],

    files: [],
    packages: [],

    async init() {
      this.root = this.$el;
      this.props.search = "";
      this.packages = fetch("/blocks", {
        headers: { accept: "application/json" },
      }).then((resp) => resp.json());
    },

    async getPackageFiles() {
      if (!this.props.selectedPackage) return;

      this.files = await fetch("/blocks/" + this.props.selectedPackage, {
        headers: { accept: "application/json" },
      }).then((resp) => resp.json());
      this.filtered = this.files;

      const file = this.files[0];
      if (!this.props.selectedFile && file) {
        this.props.selectedFile = file.name + "-" + file.type;
      }

      this.$nextTick(() => {
        const el = this.root.querySelector(
          '.section:nth-child(2) .package[data-selected="true"]'
        );
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      });
    },

    async newFile(name, source) {
      await fetch("/blocks/" + this.props.selectedPackage + "/" + name, {
        method: "POST",
        headers: { accept: "application/json" },
        body: source,
      }).then((resp) => resp.text());

      this.props.selectedFile = name.split('.')[0];
      await this.getPackageFiles();
    },

    validateName(file, save) {
      if (file.newName === "") {
        this.files.shift();
      }

      const name = file.newName?.trim();
      const validFormat = /^[a-z0-9]+(-[a-z0-9]+)*$/i;

      if (!name || !validFormat.test(name)) {
        file.error = "Use dashed lowercase, <br/>e.g. my-block";
        return;
      }

      const exists = this.files.some(
        (f) => f !== file && f.name.split("-").slice(0, -1).join("-") === name
      );

      if (exists) {
        file.error = "Name already exists";
        return;
      }

      file.error = null;

      if (save) {
        if (file.error) return;

        this.newFile(
          name + "-" + file.type + ".html",
          `<script type="module"></scr${"ipt>"}`
        );
      }
    },

    createBlock() {
      if (this.files.some((f) => f.newName !== undefined)) return;
      this.files.unshift({
        type: "block",
        name: "",
        newName: "",
      });
      this.$nextTick(() => {
        this.$host.shadowRoot.querySelector(".edit-name").focus();
      });
    },

    filter(search) {
      this.filtered = this.files.filter((f) =>
        f.name.includes(search.toLowerCase())
      );
    },
  };
</script>
