<div class="wrapper" x-effect="getPackageFiles">
  <div class="section">
    <template x-for="pkg in packages">
      <div
        class="package"
        :class="{ selected: props.selectedPackage === pkg.name }"
        x-text="pkg.name"
        @click="selectPackage(pkg.name)"
      ></div>
    </template>
  </div>
  <div class="section">
    <div class="file-menu">
      <div class="actions">
        <button @click="createScript('block')" title="Create Block">
          <!-- <div class="plus"></div> -->
          <img src="/assets/img/extension.svg" />
        </button>
        <button @click="createScript('mixin')" title="Create Mixin">
          <!-- <div class="plus"></div> -->
          <img src="/assets/img/plug.svg" />
        </button>
        <button @click="createScript('app')" title="Create App">
          <!-- <div class="plus"></div> -->
          <img src="/assets/img/bolt.svg" />
        </button>
      </div>
      <input
        id="filter"
        placeholder="Filter..."
        x-model="props.search"
        x-effect="filter(props.search)"
      />
    </div>
    <div :style="{ overflowY: 'scroll' }">
      <template x-for="file in filtered">
        <div
          class="package"
          :data-selected="props.selectedFile === file.name + '-' + file.type"
          :class="{ selected: props.selectedFile === file.name + '-' + file.type }"
          @click="if (!files.some(f => f.newName !== undefined)) {
            props.selectedFile = file.name + '-' + file.type
          }"
        >
          <img
            :style="{ alignSelf: 'flex-start' }"
            :src="file.type === 'block'
                ? '/assets/img/extension.svg'
                : file.type === 'mixin'
                  ? '/assets/img/plug.svg'
                  : '/assets/img/bolt.svg'"
          />
          <template x-if="file.newName === undefined">
            <span x-show="file.newName === undefined" x-text="file.name"></span>
          </template>
          <template x-if="file.newName !== undefined">
            <div :style="{ display: 'flex', flexDirection: 'column' }">
              <input
                class="edit-name"
                autofocus=""
                x-model="file.newName"
                x-effect="validateName(file)"
                @blur.stop.prevent="validateName(file, true)"
                @keydown.enter="validateName(file, true)"
              />
              <div
                :style="{ color: 'darkred', fontSize: '16px', textTransform: 'none' }"
                x-show="file.error"
                x-html="file.error"
              ></div>
            </div>
          </template>
          <div
            class="dirty"
            x-show="dirty && props.selectedFile === file.name + '-' + file.type"
          ></div>
        </div>
      </template>
    </div>
  </div>
  <div
    class="section"
    x-show="props.selectedFile && props.selectedFile !== 'false'"
  >
    <template x-if="props.selectedFile && props.selectedFile !== 'false'">
      <block-editor-block
        :file="`${props.selectedPackage}/${props.selectedFile}`"
      ></block-editor-block>
    </template>
  </div>
</div>

<script type="module">
  export default {
    mixins: ["@playground/block-mixin", "@playground/files-mixin"],

    dirty: false,
    files: [],
    packages: [],

    async init() {
      this.root = this.$el;
      this.props.search = "";

      setTimeout(() => {
        this.$el.querySelector("input#filter")?.focus();
      }, 200);

      this.packages = (this.doc.packages || ["@playground", "@games"]).map(
        (p) => ({
          name: p,
        })
      );

      this.getPackageFiles();
    },

    selectPackage(name) {
      this.props.search = "";
      this.props.selectedFile = false;
      this.props.selectedPackage = name;

      this.getPackageFiles();
    },

    async getPackageFiles() {
      if (!this.props.selectedPackage) {
        this.props.selectedPackage = "@playground";
        return;
      }

      this.files = await fetch("/blocks/" + this.props.selectedPackage, {
        headers: { accept: "application/json" },
      }).then((resp) => resp.json());

      this.filtered = this.files;

      const file = this.files[0];
      if (
        (!this.props.selectedFile || this.props.selectedFile === "false") &&
        file
      ) {
        this.props.selectedFile = file.name + "-" + file.type;
      }

      this.$nextTick(() => {
        const el = this.root.querySelector(
          '.section:nth-child(2) .package[data-selected="true"]'
        );
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      });
    },

    async newFile(name, source) {
      await fetch("/blocks/" + this.props.selectedPackage + "/" + name, {
        method: "POST",
        headers: { accept: "application/json" },
        body: source,
      }).then((resp) => resp.text());

      this.props.selectedFile = name.split(".")[0];
      await this.getPackageFiles();
    },

    validateName(file, save) {
      if (file.newName === "") {
        this.files.shift();
      }

      const name = file.newName?.trim();
      const validFormat = /^[a-z0-9]+(-[a-z0-9]+)*$/i;

      if (!name || !validFormat.test(name)) {
        file.error = "Use dashed lowercase, <br/>e.g. my-block";
        return;
      }

      const exists = this.files.some(
        (f) => f !== file && f.name.split("-").slice(0, -1).join("-") === name
      );

      if (exists) {
        file.error = "Name already exists";
        return;
      }

      file.error = null;

      if (save) {
        if (file.error) return;

        this.newFile(
          name + "-" + file.type + ".html",
          file.type === "block" || file.type === "mixin"
            ? `<div>My new block</div>

  <script type="module">
    export default {
      mixins: []
    }
  </${"script>"}

  <style>
  </style>`
            : `<window-block x-on:close.stop="$el.remove()" nav-title="My App">
    My new app!
  </window-block>`
        );
      }
    },

    createScript(type = "block") {
      if (this.files.some((f) => f.newName !== undefined)) return;
      this.props.search = "";
      this.files.unshift({
        type: type,
        name: "",
        newName: "",
      });
      this.$nextTick(() => {
        this.$host.shadowRoot.querySelector(".edit-name")?.focus();
      });
    },

    filter(search) {
      this.filtered = this.files?.filter((f) =>
        f.name.includes(search.toLowerCase())
      );
    },
  };
</script>

    max-height: 600px;
    font-size: 20px;

    display: flex;
    align-items: stretch;
  }

  .section {
    min-width: 120px;

  }

    border-right: 0.5px solid var(--grey);
  }

    background: #dfe2e2;
  }

  .package {
    padding: 6px 12px;

    display: flex;
    align-items: center;
    gap: 12px;
    text-transform: capitalize;
  }

  .package img {
    width: 16px;
    height: 16px;
    margin-top: 6px;
  }

  .package:hover {
    background: #eee;
    color: black;
  }

  .file-menu {
    display: flex;
    flex-direction: column;
    padding: 6px 12px;
    border-bottom: 0.5px solid var(--grey);
  }

  input {
    border-radius: 0;
    border: 0.5px solid var(--grey);
  }

  .file-menu input {
    font-size: 18px;
    padding: 0 8px;
  }

  .actions {
    display: flex;
    gap: 8px;
    padding-bottom: 8px;
  }

  .actions button {
    position: relative;
    background: white;
    border: 0.5px solid var(--grey);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    cursor: pointer;
  }

  .actions img {
    height: 16px;
    width: 16px;
  }

  .actions .plus {
    position: absolute;

  }

  }

    width: 8px;

  }
</style>
