<style>
  :host {
    position: absolute;
    top: 0;
    left: 0;
  }

  .wrapper {
    max-height: 600px;
    font-size: 20px;

    display: flex;
    align-items: stretch;
  }

  .section {
    min-width: 120px;
    overflow-y: scroll;
  }

  .section:nth-child(2) {
    min-width: 180px;
  }

  .section:not(:last-child) {
    border-right: 1px solid #36454f;
  }

  .package {
    padding: 6px 12px;
    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: capitalize;
  }

  .package img {
    width: 14px;
    height: 14px;
  }

  .package:hover {
    background: #eee;
  }
</style>

<window-block
  nav-title="Library"
  @close.stop="$host.remove()"
  x-effect="getPackageFiles"
>
  <div class="wrapper">
    <div class="section">
      <template x-for="package in packages">
        <div
          class="package"
          :style="{ background: props.selectedPackage === package.name ? '#eee' : '' }"
          x-text="package.name"
          @click="props.selectedPackage = package.name"
        ></div>
      </template>
    </div>
    <div class="section">
      <template x-for="file in files">
        <div
          class="package"
          :data-selected="props.selectedFile === file.name + '-' + file.type ? 'true' : null"
          :style="{ background: props.selectedFile === file.name + '-' + file.type ? '#eee' : '' }"
          @click="props.selectedFile = file.name + '-' + file.type"
        >
          <img
            :src="file.type === 'block' ? '/assets/img/extension.svg' : '/assets/img/plug.svg'"
          />
          <span x-text="file.name"></span>
        </div>
      </template>
    </div>
    <div class="section" x-show="props.selectedFile">
      <template x-if="props.selectedFile">
        <block-editor-block :file="props.selectedFile"></block-editor-block>
      </template>
    </div>
  </div>
</window-block>

<script type="module">
  import block from "@playground/block-mixin";
  import draggable from "@playground/draggable-mixin";

  export default {
    mixins: [block, draggable],

    height: 0,
    files: [],
    packages: [],

    async init() {
      this.packages = fetch("/blocks", {
        headers: { accept: "application/json" },
      }).then((resp) => resp.json());
    },

    async getPackageFiles() {
      if (!this.props.selectedPackage) return;

      this.files = await fetch("/blocks/" + this.props.selectedPackage, {
        headers: { accept: "application/json" },
      }).then((resp) => resp.json());

      const file = this.files[0];
      if (!this.props.selectedFile && file) {
        this.props.selectedFile = file.name + "-" + file.type;
      }

      setTimeout(() => {
        const el = this.$el.querySelector(
          '.section:nth-child(2) .package[data-selected="true"]'
        );
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }, 50);
    },
  };
</script>
