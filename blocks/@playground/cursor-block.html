<style>
  :host {
    position: absolute;
    display: block;
    top: 0;
    left: 0;
  }
  div {
    display: flex;
    flex-direction: column;
  }
  img {
    margin-left: -2px;
    margin-top: -3px;
    width: 20px;
    height: 20px;
  }
</style>

<div
  @peer-mousemove.window="positionUpdated"
  :style="{ transform: `translate(${mouseX}px, ${mouseY}px)`}"
>
  <img src="/assets/img/cursor.png" />
  <span x-text="props.peer"></span>
</div>

<script type="module">
  export default {
    mixins: ["@playground/block-mixin"],
    mouseX: 0,
    mouseY: 0,
    positionUpdated(event) {
      const { senderId, mouseX, mouseY } = event.detail;
      if (senderId !== this.props.peer) return;

      this.mouseX = mouseX;
      this.mouseY = mouseY;

      clearTimeout(this.timeoutId);
      this.timeoutId = setTimeout(() => {
        this.$host.remove();
      }, 1000);
    },
  };
</script>
