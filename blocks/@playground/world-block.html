<style>
  .world {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .world::before {
    z-index: -1;
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    text-align: center;
    background: white; /*#22333b*/
  }
  .space {
    touch-action: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 4096px;
    height: 4096px;
    background-size: 32px 32px;
    background-image: linear-gradient(
        to right,
        rgba(40, 126, 255, 0.1) 1px,
        transparent 1px
      ),
      linear-gradient(to bottom, rgba(40, 126, 255, 0.1) 1px, transparent 1px);
    transform: translate3d(0, 0, 0);
  }
</style>

<div
  class="world"
  @peer-mousemove.document="peerMouseMove"
  @mousemove.document="handleMouseMove"
  @touchmove.document="handleMouseMove"
>
  <div
    class="space"
    :style="{ transform: `translate(-${scrollX}px, -${scrollY}px)`}"
  >
    <template x-teleport="body">
      <navbar-block></navbar-block>
    </template>
    <template x-teleport="body">
      <minimap-block></minimap-block>
    </template>
    <slot></slot>
  </div>
</div>

<script type="module">
  import blockMixin from "@playground/block-mixin";
  import worldSyncMixin from "@playground/world-sync-mixin";

  export default {
    mixins: [blockMixin, worldSyncMixin],
    scrollX: 0,
    scrollY: 0,
    peerMouseMove,
    handleMouseMove,
    init() {
      this.world = this.$host.shadowRoot.querySelector(".world");
      this.space = this.$host.shadowRoot.querySelector(".space");

      this.scrollX = (this.space.offsetWidth - this.world.offsetWidth) / 2;
      this.scrollY = (this.space.offsetHeight - this.world.offsetHeight) / 2;

      document.addEventListener("wheel", handleScroll.bind(this), {
        passive: false,
      });
      document.addEventListener("touchmove", handleScroll.bind(this), {
        passive: true,
      });

      this._heartbeatInterval = setInterval(() => {
        this.$broadcast("heartbeat", { timestamp: Date.now() });
      }, 1000);
    },
  };

  function peerMouseMove(e) {
    let cursor = this.space.querySelector(
      `cursor-block[peer="${e.detail.senderId}"]`
    );
    if (!cursor) {
      this.space.insertAdjacentHTML(
        "beforeend",
        `<cursor-block peer="${e.detail.senderId}"></cursor-block>`
      );
    }
  }

  function handleMouseMove(e) {
    let mouseX, mouseY;
    if (e.type.startsWith("touch")) {
      const touch = e.touches[0] || e.changedTouches[0];
      mouseX = touch.clientX + this.scrollX;
      mouseY = touch.clientY + this.scrollY;
    } else {
      mouseX = e.clientX + this.scrollX;
      mouseY = e.clientY + this.scrollY;
    }
    this.$broadcast("mousemove", {
      mouseX,
      mouseY,
    });
  }

  function handleScroll(e) {
    if (this.menuOpen) {
      return;
    }

    let deltaX = 0;
    let deltaY = 0;

    if (e.type === "wheel") {
      deltaX = e.deltaX;
      deltaY = e.deltaY;
      e.preventDefault();
    } else if (e.type === "touchmove") {
      if (!this._lastTouch) {
        this._lastTouch = e.touches[0];
        return;
      }
      const touch = e.touches[0];
      deltaX = this._lastTouch.clientX - touch.clientX;
      deltaY = this._lastTouch.clientY - touch.clientY;
      this._lastTouch = touch;
      e.preventDefault();
    }

    const newScrollX = this.scrollX + deltaX;
    const newScrollY = this.scrollY + deltaY;

    const maxScrollX = this.space.offsetWidth - this.world.offsetWidth;
    const maxScrollY = this.space.offsetHeight - this.world.offsetHeight;

    this.scrollX = Math.round(Math.max(0, Math.min(newScrollX, maxScrollX)));
    this.scrollY = Math.round(Math.max(0, Math.min(newScrollY, maxScrollY)));
  }
</script>
