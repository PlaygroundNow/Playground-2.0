<div
  class="world"
  @peer-mousemove.document="peerMouseMove"
  @mousemove.document="handleMouseMove"
  @touchmove.document="handleMouseMove"
  @peer-updated-file.window="updatedFile"
  @keydown.window="if ($event.key.toLowerCase() === 'k' && $event.metaKey) openLibrary()"
>
  <div id="space" class="space">
    <template x-teleport="body">
      <navbar-block data-block="world-block"></navbar-block>
    </template>
    <template x-teleport="body">
      <minimap-block data-block="world-block"></minimap-block>
    </template>
    <slot></slot>
  </div>
</div>

<script type="module">
  import block from "@playground/block-mixin";
  import worldSync from "@playground/world-sync-mixin";
  import worldScroll from "@playground/world-scroll-mixin";
  import worldTheme from "@playground/world-theme-mixin";

  export default {
    mixins: [block, worldSync, worldScroll, worldTheme],
    door: true,
    peerMouseMove,
    handleMouseMove,

    async updatedFile(event) {
      const { file, name, tag, senderId } = event.detail;

      const html = await fetch(file).then((resp) => resp.text());

      if (tag.endsWith("mixin")) return;

      const wc = customElements.get(tag);
      wc.template = html;
    },
    init() {
      this.world = this.$host.shadowRoot.querySelector(".world");
      this.space = this.$host.shadowRoot.querySelector(".space");

      this._heartbeatInterval = setInterval(() => {
        this.$broadcast("heartbeat", { timestamp: Date.now() });
      }, 1000);

      // if (
      //   localStorage.getItem("door") !== "true" ||
      //   document.querySelectorAll("welcome-block").length
      // ) {
      //   this.door = false;
      //   const screenWidth = this.space.clientWidth / 2 - 150;
      //   const screenHeight = this.space.clientHeight / 2 - 300;
      //   document.querySelectorAll("welcome-block").forEach((b) => {
      //     b.remove();
      //   });
      //   document
      //     .querySelector("world-block")
      //     .insertAdjacentHTML(
      //       "afterbegin",
      //       `<welcome-block x="${screenWidth}" y="${screenHeight}" data-block="world-block"></welcome-block>`
      //     );
      // } else {
      //   this.door = true;
      // }
    },
  };

  function handleMouseMove(e) {
    let mouseX, mouseY;
    if (e.type.startsWith("touch")) {
      const touch = e.touches[0] || e.changedTouches[0];
      mouseX = touch.clientX + this.scrollX;
      mouseY = touch.clientY + this.scrollY;
    } else {
      mouseX = e.clientX + this.scrollX;
      mouseY = e.clientY + this.scrollY;
    }
    this.$broadcast("mousemove", {
      mouseX,
      mouseY,
    });
  }

  function peerMouseMove(e) {
    let cursor = this.space.querySelector(
      `cursor-block[peer="${e.detail.senderId}"]`
    );
    if (!cursor) {
      this.space.insertAdjacentHTML(
        "beforeend",
        `<cursor-block peer="${e.detail.senderId}"></cursor-block>`
      );
    }
  }
</script>

    position: relative;
    width: 100vw;

    top: 0;
    left: 0;
    right: 0;
