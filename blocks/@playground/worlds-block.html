<div x-effect="getWorlds()" class="wrapper">
  <img class="logo" src="/assets/img/favicon.svg" />

  <flex-block
    :style="{ flexDirection: 'column', alignItems: 'center', fontSize: '64px', marginTop: '-120px', color: 'white' }"
  >
    <h1>Welcome to Playground</h1>
    <div class="grey">The collaborative web toolkit</div>
  </flex-block>

  <flex-block>
    <template x-for="world in worlds">
      <div
        @click="location.href = '/worlds/' + world.automerge_id"
        class="world"
      >
        <div class="pane"></div>
        <div class="title">My world</div>
      </div>
    </template>
  </flex-block>

  <flex-block>
    <button @click="createWorld()">Create a World</button>
  </flex-block>
</div>

<script type="module">
  export default {
    mixins: [],
    worlds: [],
    async getWorlds() {
      const data = await fetch("/worlds", {
        headers: new Headers({
          accept: "application/json",
        }),
        credentials: "include",
      }).then((resp) => resp.json());

      this.worlds = data;
    },
    async createWorld() {
      const worldHandle = repo.create({
        packages: ["@playground"],
        theme: "turf",
        world: [],
      });

      await fetch("/worlds", {
        method: "POST",
        credentials: "include",
        headers: new Headers({
          accept: "application/json",
        }),
        body: JSON.stringify({
          id: worldHandle.url.split(":")[1],
        }),
      });
    },
  };
</script>
