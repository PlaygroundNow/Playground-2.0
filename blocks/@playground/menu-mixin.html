<template x-if="menuOpen">
  <template x-teleport="body">
    <menu-block
      data-block="menu-mixin"
      :x="menuX"
      :y="menuY"
      @click.window="menuOpen = false"
    />
  </template>
</template>

<script type="module">
  export default {
    label: "",
    tag: "",
    menuOpen: false,
    menuX: 0,
    menuY: 0,
    init() {
      this.tag = this.$host.tagName;
      this.label = this.$host.tagName
        .toLowerCase()
        .split("-")
        .slice(0, -1)
        .join(" ");

      this.$host.addEventListener("contextmenu", (e) => {
        e.stopPropagation();
        e.preventDefault();
        
        this.menuX = e.x;
        this.menuY = e.y;

        this.menuOpen = true;
      });
    },
  };
</script>
