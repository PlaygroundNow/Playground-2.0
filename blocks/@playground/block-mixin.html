<style>
  *,
  *::before,
  *::after {
    font-family: "Nanum Pen Script", Cambria, Cochin, Georgia, Times,
      "Times New Roman", serif;
    box-sizing: border-box;
  }

  :host {
    --red: #F15156;
    --yellow: #FFB400;
    --blue: #7289DA;
    --pink: #FF66CC;
    --purple: #A569BD;
    --green: #34BE5B;
    --grey: #505A5B;
  }
</style>

<script type="module">
  import menu from "@playground/menu-mixin";
  import coordinates from "@playground/coordinates-mixin";

  export default {
    mixins: [menu, coordinates],
    openBlock(tag) {
      const x = Number(this.props.x);
      const y = Number(this.props.y);

      this.world = document
        .querySelector("world-block")
        .shadowRoot.querySelector(".world");
      this.space = document
        .querySelector("world-block")
        .shadowRoot.querySelector(".space");

      const screenWidth = window.innerWidth / 2 - 550;
      const screenHeight = window.innerHeight / 2 - 300;

      const libraryHtml =`<${tag} x="${screenWidth + this.$world.scrollX}" y="${
        screenHeight + this.$world.scrollY
      }"></${tag}>`;

      const world = document.querySelector("world-block");
      if (world) {
        world.insertAdjacentHTML("beforeend", libraryHtml);
      }
    },
    openLibrary(pkg, location) {
      this.openBlock('library-block')
    },
  };
</script>
