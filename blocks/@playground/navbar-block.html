<div @peer-heartbeat.window="heartbeat" @resize.window="width = window.innerWidth" class="wrapper">
  <div class="square white" :class="{ active: spotlightOpen }" @click.stop="spotlightOpen = !spotlightOpen">
    <img src="/assets/img/favicon.svg">
  </div>

  <div id="spotlight" x-show="spotlightOpen" class="spotlight" @click.outside="if ($event.target.tagName !== 'NAVBAR-BLOCK') {
    spotlightOpen = false
  }">
    <div class="search">
      <img src="/assets/img/search.svg"><input x-effect="spotlightOpen && $nextTick(() => $el.focus())" autofocus="true" x-model="search">
    </div>
    <flex-block :style="{ gap: '12px', flexWrap: 'wrap' }" x-data="{
      apps: [],
      async init() {
        const blocks = await Promise.all(doc.packages.map(function(pkg) {
          return fetch('/blocks/' + pkg, { headers: { accept: 'application/json' }})
            .then(function(resp) { return resp.json() })
            .then(function(data) {
              return data.map(function(d) {  return { pkg, ...d } });
            });
        }));
        this.apps = blocks
          .flat()
          .filter(function(b) { return b.type === 'app' && b.name !== 'apps' });
      }
    }">
      <template x-for="pkg in apps">
        <app-block @click="spotlightOpen = false" :pkg="pkg.pkg" :tag="`${pkg.name}-app`" :icon="pkg.name" :label="`${pkg.name.split('-').join(' ')}`"></app-block>
      </template>
    </flex-block>
  </div>

  <template x-teleport="body">
    <div data-block="navbar-block" @click.outside="themeOpen = false" :style="{ position: 'fixed', top: '12px', right: '12px' }">
      <button @click="themeOpen = !themeOpen" :style="{ cursor: 'pointer', background: '#222', border: 0, padding: '6px', border: '1px solid rgba(255, 255, 255, 0.5)', borderRadius: '4px' }">
        <img :style="{ filter: 'invert(1)', width: '22px' }" src="/assets/img/theme.svg">
      </button>
      <div x-show="themeOpen" x-transition="" :style="{ textAlign: 'right', color: 'white', position: 'absolute', marginTop: '1px', right: 0 }">
        <template x-for="bg in ['snow', 'bubble', 'night']">
          <button :style="{
              marginBottom: '1px',
              cursor: 'pointer',
              width: '120px',
              background: '#222',
              color: 'white',
              borderRadius: '4px',
              border: '1px solid rgba(255, 255, 255, 0.5)',
            }" x-text="bg" @click="$world.theme = bg"></button>
        </template>
        <div :style="{ lineHeight: 1, marginTop: '4px' }">
          particles.js<br>vincentgarreau.com
        </div>
      </div>
    </div>
  </template>

  <template x-teleport="body">
    <data data-block="navbar-block" x-text="numOps" :style="{ color: 'white', position: 'fixed', bottom: '12px', left: '12px', fontFamily: 'monospace', fontSize: '12px' }"></data>
  </template>
</div>

<script type="module">
  export default {
    mixins: ["@playground/block-mixin"],
    search: '',
    themeOpen: false,
    spotlightOpen: false,
    heartbeats: {},
    numOps: 0,
    peers: new Set(["Me"]),
    width: window.innerWidth,
    init() {
      this.numOps = this.formatStats(handle.doc());
      handle.on("change", ({ doc }) => (this.numOps = this.formatStats(doc)));

      setInterval(() => {
        const now = Date.now();
        for (const [senderId, last] of Object.entries(this.heartbeat)) {
          if (now - new Date(last).getTime() > 1000 * 3) {
            const peerName = senderId.split("-")[1];
            this.peers.delete(peerName);
            delete this.heartbeat[senderId];
          }
        }
      }, 1000 * 3);
    },
    heartbeat(event) {
      this.peers.add(event.detail.senderId.split("-")[1]);
      this.heartbeat[event.detail.senderId] = new Date();
    },
    formatStats(doc) {
      const { numOps, numChanges } = Automerge.stats(doc);
      return `${numOps.toLocaleString()} ops & ${numChanges.toLocaleString()} changes`;
    },
  };
</script>
