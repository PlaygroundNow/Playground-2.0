  @peer-heartbeat.window="heartbeat"
  @resize.window="width = window.innerWidth"

    <img
      :style="{ scale: 1.2, marginBottom: '2px' }"

  <div class="square" :class="{ blue: door }" title="Games" @click="door">

  </div>
  <div class="square"></div>
  <div class="square"></div>
  <div
    class="square"

  >

  <!-- <div class="people">
    <div class="peers" :title="`${Array.from(peers).length} document viewer.`">
      <div class="peer" x-text="Array.from(peers).length"></div>
    </div>
  </div> -->

  <template x-teleport="body">
    <data
      data-block="navbar-block"
      x-text="numOps"
      :style="{
        position: 'fixed',
        bottom: '12px',
        left: '12px',
        fontFamily: 'monospace',
        fontSize: '12px'
      }"
    ></data>
  </template>
</div>

<script type="module">
  import block from "@playground/block-mixin";

  export default {
    mixins: [block],
    heartbeats: {},
    numOps: 0,
    peers: new Set(["Me"]),
    width: window.innerWidth,
    init() {
      this.numOps = this.formatStats(handle.doc());
      handle.on("change", ({ doc }) => (this.numOps = this.formatStats(doc)));

      setInterval(() => {
        const now = Date.now();
        for (const [senderId, last] of Object.entries(this.heartbeat)) {
          if (now - new Date(last).getTime() > 1000 * 3) {
            const peerName = senderId.split("-")[1];
            this.peers.delete(peerName);
            delete this.heartbeat[senderId];
          }
        }
      }, 1000 * 3);
    },
    heartbeat(event) {
      this.peers.add(event.detail.senderId.split("-")[1]);
      this.heartbeat[event.detail.senderId] = new Date();
    },
    formatStats(doc) {
      const { numOps, numChanges } = Automerge.stats(doc);
      return `${numOps.toLocaleString()} ops & ${numChanges.toLocaleString()} changes`;
    },
  };
</script>
