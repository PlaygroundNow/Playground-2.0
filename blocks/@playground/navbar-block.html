<style>
  .wrapper {
    z-index: 1000;
    position: fixed;
    top: 0;
    left: 0;
    width: calc(100vw - 48px);
    margin: 10px 12px 0 12px;
    background: #19647e;
    border-radius: 8px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: white;
    padding: 0 12px;
    font-size: 24px;
  }

  @media (max-width: 600px) {
    .logo *:not(img) {
      display: none;
    }
  }

  .peers {
    display: flex;
    gap: 8px;
    margin-left: 16px;
    align-items: center;
  }

  .peer {
    width: 24px;
    height: 24px;
    background: pink;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: black;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
  }

  img {
    margin-right: 8px;
  }

  .logo {
    display: flex;
    align-items: center;
  }

  .logo data {
    font-family: monospace;
    font-size: 12px;
  }
</style>

<div
  @peer-heartbeat.window="heartbeat"
  @resize.window="width = window.innerWidth"
  class="wrapper"
>
  <div class="logo">
    <img src="/assets/img/favicon.svg" />
    <div>Playground</div>
    <div>&nbsp;-&nbsp;</div>
    <data x-text="numOps"></data>
  </div>
  <div
    :style="{
        display: 'flex',
        position: 'absolute',
        left: width <= 800 ? '40px' : '50%',
        top: '50%',
        transform: width <= 800 ? 'translateY(-50%)' : 'translate(-50%,-50%)'
      }"
  >
    Home
    <div class="peers">
      <div class="peer" x-text="Array.from(peers).length"></div>
      <!--<template x-for="peer in Array.from(peers)">
        <div class="peer" x-text="peer.slice(0,2)"></div>
      </template>-->
    </div>
  </div>
  <spotlight-button-block></spotlight-button-block>
</div>

<script type="module">
  import block from "@playground/block-mixin";

  export default {
    mixins: [block],
    heartbeats: {},
    numOps: 0,
    peers: new Set(["Me"]),
    width: window.innerWidth,
    heartbeat(event) {
      this.peers.add(event.detail.senderId.split("-")[1]);
      this.heartbeat[event.detail.senderId] = new Date();
    },
    formatStats(doc) {
      const { numOps, numChanges } = Automerge.stats(doc);
      return `[${numOps} ops & ${numChanges} changes]`;
    },

    init() {
      this.numOps = this.formatStats(handle.doc());
      handle.on("change", ({ doc }) => (this.numOps = this.formatStats(doc)));

      setInterval(() => {
        const now = Date.now();
        for (const [senderId, last] of Object.entries(this.heartbeat)) {
          if (now - new Date(last).getTime() > 1000 * 3) {
            const peerName = senderId.split("-")[1];
            this.peers.delete(peerName);
            delete this.heartbeat[senderId];
          }
        }
      }, 1000 * 3);
    },

    destroy() {},
  };
</script>
