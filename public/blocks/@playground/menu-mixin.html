<style>
  ul {
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    z-index: 1000;
    padding-left: 0;
    list-style: none;
    border-radius: 5px;
    padding-bottom: 5px;
    background: white;
    border: 1px solid black;
    width: 140px;
    color: black;
  }

  li {
    width: 138px;
    cursor: pointer;
    list-style: none;
    padding: 3px 5px 3px 8px;
    display: flex;
    justify-content: start;
    align-items: center;
    gap: 8px;
    font-size: 20px;
  }

  li:hover {
    background: #eee;
  }

  .menu img {
    width: 14px;
    height: 14px;
  }
</style>

<template x-if="menuOpen">
  <ul
    class="menu"
    :style="{ transform: `translate(${x}px, ${y}px )`}"
    @click.outside="menuOpen = false"
    @click.stop
  >
    <div
      :style="{ textTransform: 'capitalize', backgroundColor: '#36454f', color: 'white', padding: '4px 8px', fontSize: label.length > 12 ? '18px' : '22px' }"
      x-text="$host.tagName
          .toLowerCase()
          .split('-')
          .slice(0, -1)
          .join(' ');"
    ></div>
    <li @click.stop="openLibrary">
      <img src="/assets/img/board.svg" /> Library
    </li>
    <li @click.stop><img src="/assets/img/htmx.svg" /> Script</li>
  </ul>
</template>

<script type="module">
  export default {
    menuOpen: false,
    label: "",
    x: 0,
    y: 0,
    init() {
      this.$host.addEventListener("contextmenu", (e) => {
        e.stopPropagation();
        e.preventDefault();

        const style = window.getComputedStyle(this.$host);
        const position = style.position;
        if (position === "absolute" || position === "fixed") {
          const rect = this.$host.getBoundingClientRect();

          this.x = e.x - rect.x;
          this.y = e.y - rect.y;
        } else {
          this.x = e.x;
          this.y = e.y;
        }

        this.menuOpen = true;
      });
    },
    openLibrary() {
      const libraryHtml = `<library-block x="${this.x + this.scrollX}" y="${
        this.y + this.scrollY
      }"></library-block>`;
      const world = document.querySelector("world-block");
      if (world) {
        world.insertAdjacentHTML("beforeend", libraryHtml);
      }
      this.menuOpen = false;
    },
  };
</script>
