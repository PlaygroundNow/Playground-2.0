<style>
  ul {
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    z-index: 1000;
    padding-left: 0;
    list-style: none;
    border-radius: 5px;
    padding-bottom: 5px;
    background: white;
    border: 1px solid black;
    width: 140px;
  }

  li {
    width: 138px;
    cursor: pointer;
    list-style: none;
    padding: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 18px;
  }

  li:hover {
    background: #eee;
  }

  img {
    width: 14px;
    height: 14px;
  }
</style>

<template x-if="menuOpen">
  <ul
    :style="{ transform: `translate(${x}px, ${y}px )`}"
    @click.outside="menuOpen = false"
    @click.stop
  >
    <div
      :style="{ textTransform: 'capitalize', backgroundColor: '#36454f', color: 'white', padding: '4px 8px', fontSize: '20px' }"
      x-text="$host.tagName.toLowerCase().split('-').slice(0, -1).join(' ')"
    ></div>
    <li @click.stop><img src="/assets/img/htmx.svg" /> Code</li>
  </ul>
</template>

<script type="module">
  export default {
    menuOpen: false,
    x: 0,
    y: 0,
    init() {
      this.$host.addEventListener(
        "contextmenu",
        (e) => {
          e.preventDefault();

          this.x = e.x;
          this.y = e.y;
          this.menuOpen = true;
        },
        true
      );
    },
  };
</script>
