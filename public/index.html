<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link href="/assets/css/reset.css" rel="stylesheet" />
    <link
      rel="icon"
      href="./assets/img/favicon.svg"
      sizes="any"
      type="image/svg+xml"
    />
    <style>
      * {
        font-family: "Nanum Pen Script", Cambria, Cochin, Georgia, Times,
          "Times New Roman", serif;
      }
      html,
      body {
        margin: 0;
      }
    </style>
    <script>
      window.ALPINE_VERSION = "3.15.0";

  <body x-data="playground">

    <script type="importmap">

          "@playground/": "/blocks/@playground/"
        }
      }
    </script>
    <script src="/assets/scripts/playground.js" type="module"></script>

</html>
